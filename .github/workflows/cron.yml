name: Angirus Auto-Responder

on:
  schedule:
    # Runs every 15 minutes. Note: GitHub Actions cron can sometimes be slightly delayed based on server load.
    - cron: '*/15 * * * *'
  workflow_dispatch: # This allows you to click a button to run it manually

jobs:
  check-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install -r requirements.txt
        
      - name: Run Auto-Responder Script
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py
